<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#e6e8ee;font-size:12.5px;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}

:root{
  --bg-soft:rgba(31,34,48,0.92);
  --bg-card:rgba(38,42,58,0.95);
  --bg-input:rgba(20,22,32,0.85);
  --border:rgba(255,255,255,0.10);
  --text:#e6e8ee;
  --text-dim:#8a8e9c;
  --accent:#5dade2;
}

.box{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--bg-soft);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,0.55);
}

.head{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;
  background:rgba(0,0,0,0.18);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.drag-handle{
  flex-shrink:0;
  width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;
  color:rgba(255,255,255,0.30);
  opacity:0.55;
  touch-action:none;user-select:none;
}
.drag-handle:hover{opacity:1;color:rgba(255,255,255,0.85)}
.drag-handle.is-dragging{cursor:grabbing;opacity:1;color:#5dade2}
.drag-handle svg{width:12px;height:12px;display:block;pointer-events:none}
.head-title{
  font-size:11px;font-weight:700;color:var(--text);
  text-transform:uppercase;letter-spacing:0.6px;
  flex:1;
}
.head-x{
  background:transparent;border:none;
  color:var(--text-dim);
  cursor:pointer;
  font-size:14px;line-height:1;
  width:20px;height:20px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:4px;
  font-family:inherit;
}
.head-x:hover{background:rgba(255,255,255,0.10);color:var(--text)}

.msgs{
  flex:1;overflow-y:auto;
  padding:6px 8px;
  display:flex;flex-direction:column;gap:4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.msgs::-webkit-scrollbar{width:0;height:0;display:none}

.msg{
  display:flex;gap:8px;
  padding:6px 8px;
  border-radius:6px;
  background:rgba(255,255,255,0.03);
  border:1px solid transparent;
  transition:background .12s;
  cursor:default;
}
.msg[data-sender-id]:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.08);
}
.msg[data-sender-id]{cursor:pointer}

.msg-avatar{
  flex-shrink:0;
  width:28px;height:28px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
  color:#fff;
}
.msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.msg-head{display:flex;align-items:baseline;gap:6px}
.msg-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-time{font-size:9px;color:var(--text-dim);flex-shrink:0}
.msg-content{font-size:12px;line-height:1.4;word-break:break-word;color:var(--text)}

.msg.roll{border-left:2px solid #5dade2;background:rgba(93,173,226,0.06)}
.msg.system .msg-content{color:var(--text-dim);font-style:italic;font-size:11px}
.msg.roll .msg-content{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11px;color:#9bd0f0}

.empty{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:11.5px;
  padding:24px 12px;text-align:center;
}

.input-bar{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.12);
  flex-shrink:0;
}
.input-bar input{
  flex:1;
  background:var(--bg-input);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:6px;
  padding:6px 10px;
  font-size:12px;color:var(--text);
  font-family:inherit;
  outline:none;
}
.input-bar input:focus{border-color:rgba(93,173,226,0.5)}
.input-bar input::placeholder{color:rgba(255,255,255,0.25)}
.send-btn{
  flex-shrink:0;
  background:rgba(93,173,226,0.18);
  border:1px solid rgba(93,173,226,0.4);
  border-radius:6px;
  color:#5dade2;
  font-family:inherit;font-size:11px;font-weight:700;
  padding:6px 12px;cursor:pointer;
  transition:background .12s;
}
.send-btn:hover{background:rgba(93,173,226,0.3)}

.resize-handle{
  position:absolute;
  bottom:0;right:0;
  width:14px;height:14px;
  cursor:nwse-resize;
  color:rgba(255,255,255,0.25);
  z-index:5;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:2px;
}
.resize-handle:hover{color:rgba(255,255,255,0.6)}
.resize-handle svg{width:10px;height:10px;display:block;pointer-events:none}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="head">
    <span class="drag-handle" id="drag-handle" title="拖动 / Drag" aria-label="拖动聊天面板">
      <svg viewBox="0 0 8 14" aria-hidden="true">
        <circle cx="2" cy="2" r="1.2" fill="currentColor"/>
        <circle cx="6" cy="2" r="1.2" fill="currentColor"/>
        <circle cx="2" cy="7" r="1.2" fill="currentColor"/>
        <circle cx="6" cy="7" r="1.2" fill="currentColor"/>
        <circle cx="2" cy="12" r="1.2" fill="currentColor"/>
        <circle cx="6" cy="12" r="1.2" fill="currentColor"/>
      </svg>
    </span>
    <span class="head-title" data-i18n="chatTitle">聊天</span>
    <button class="head-x" id="btn-close" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="msgs" id="msgs">
    <div class="empty" data-i18n="chatEmpty">暂无消息</div>
  </div>
  <div class="input-bar">
    <input type="text" id="input" data-i18n-placeholder="chatPlaceholder" placeholder="输入消息…" maxlength="500">
    <button class="send-btn" id="btn-send" type="button" data-i18n="chatSend">发送</button>
  </div>
  <div class="resize-handle" id="resize-handle" title="拖动调整大小">
    <svg viewBox="0 0 10 10" aria-hidden="true">
      <path d="M0 10 L10 10 L10 0" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>
</div>
<script type="module" src="/src/modules/chat/page.ts"></script>
</body>
</html>
